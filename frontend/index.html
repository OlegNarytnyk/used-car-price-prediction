<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Used Car Price Prediction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Used Car Price Prediction</h1>
      <p>A minimal demo interface for the local FastAPI machine learning service.</p>
    </header>

    <form id="prediction-form" class="prediction-form">
      <div class="field">
        <label for="brand">Brand</label>
        <select id="brand" name="brand" required></select>
      </div>

      <div class="field">
        <label for="model">Model</label>
        <select id="model" name="model" required></select>
      </div>

      <div class="field">
        <label for="year">Year</label>
        <input id="year" name="year" type="number" min="1990" max="2026" value="2018" required>
      </div>

      <div class="field">
        <label for="transmission">Transmission</label>
        <select id="transmission" name="transmission" required></select>
      </div>

      <div class="field">
        <label for="mileage">Mileage</label>
        <input id="mileage" name="mileage" type="number" min="0" value="40000" required>
      </div>

      <div class="field">
        <label for="fuelType">Fuel Type</label>
        <select id="fuelType" name="fuelType" required></select>
      </div>

      <div class="field">
        <label for="tax">Tax</label>
        <input id="tax" name="tax" type="number" min="0" step="0.01" value="145" required>
      </div>

      <div class="field">
        <label for="mpg">MPG</label>
        <input id="mpg" name="mpg" type="number" min="0.1" step="0.1" value="58.9" required>
      </div>

      <div class="field">
        <label for="engineSize">Engine Size</label>
        <input id="engineSize" name="engineSize" type="number" min="0.1" step="0.1" value="1.0" required>
      </div>

      <button id="predict-button" type="submit">Predict Price</button>
    </form>

    <p id="loading" class="loading" hidden>Loading...</p>
    <p id="error-message" class="error-message" role="alert"></p>
    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
